appId: com.CTYunPCKeepAlive.electron
productName: CTYunPCKeepAlive
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!CHANGELOG.md"
  - "!{.env,.env.*,pnpm-lock.yaml}"
  - "!tsconfig.node.json"
asarUnpack:
  - resources/**
win:
  executableName: CTYunPCKeepAlive
  icon: resources/icon.ico
  target:
    - target: nsis
    - target: portable
nsis:
  artifactName: ${productName}-electron-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
portable:
  artifactName: ${productName}-electron-${version}-${arch}-portable.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
